name: Cleanup temporary branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches created during history rewrite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            final-temp-check \
            history-rewrite-backup \
            noop \
            rewrite-work \
            stop-temp \
            test-tree-call-impossible \
            __tmp__ \
            tmp2 \
            why-is-this-happening \
            x-temp
          do
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/${branch}" || true
          done
