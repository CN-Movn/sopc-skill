name: Validate release metadata

on:
  push:
    branches: [main]
    paths:
      - README.md
      - "*/VERSION"
      - "*/README.md"
      - "*/CHANGELOG.md"
      - scripts/validate_release_versions.py
      - tests/test_release_versions.py
      - .github/workflows/release-metadata.yml
  pull_request:
    paths:
      - README.md
      - "*/VERSION"
      - "*/README.md"
      - "*/CHANGELOG.md"
      - scripts/validate_release_versions.py
      - tests/test_release_versions.py
      - .github/workflows/release-metadata.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository version table
        run: python scripts/validate_release_versions.py

      - name: Validate rtl-style release metadata
        run: python rtl-style/scripts/validate_version.py

      - name: Validate py-hosttool release metadata
        run: python py-hosttool/scripts/validate_version.py

      - name: Run repository release regression tests
        run: python -B -m unittest discover -s tests -v
